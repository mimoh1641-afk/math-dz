<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math DZ — Admin</title>
<style>
body{margin:0;background:#f4f7fb;color:#17243b;font-family:Arial,Tahoma,sans-serif}.top{background:#0d1b34;color:#fff;padding:17px 20px;display:flex}.brand{margin-left:auto;font-weight:800}.wrap{max-width:1000px;margin:25px auto;padding:0 15px}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 8px 25px #1020400b;margin-bottom:18px}label{display:block;font-weight:bold;margin:15px 0 7px}input,select{width:100%;padding:12px;border:1px solid #dce3ed;border-radius:10px;box-sizing:border-box}.drop{margin-top:8px;padding:25px;border:2px dashed #b7c6dc;border-radius:14px;text-align:center;color:#718096;cursor:pointer}.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.pre img{width:100%;height:140px;object-fit:cover;border-radius:10px}.btn{padding:12px 18px;border:0;border-radius:10px;background:#1769e0;color:white;font-size:15px;cursor:pointer}.danger{background:#c83f3f}.hidden{display:none}.row{display:flex;gap:10px;align-items:center}.item{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:10px}.msg{margin-top:12px;padding:10px;border-radius:9px;background:#eef6ff;color:#19579d}
</style></head><body><header class="top"><div class="brand">π Math DZ — لوحة الإدارة</div></header>
<main class="wrap">
<section id="login" class="card"><h2>🔐 دخول الإدارة</h2><p>هذه الصفحة خاصة بصاحب الموقع.</p><input id="pass" type="password" placeholder="كلمة سر الإدارة"><button class="btn" onclick="login()">دخول</button><div id="loginMsg"></div></section>
<div id="panel" class="hidden">
<section class="card"><div class="row"><h2 style="margin-left:auto">➕ إضافة درس</h2><button class="btn danger" onclick="logout()">خروج</button></div>
<label>عنوان الدرس</label><input id="title" placeholder="مثال: مجموعات الأعداد الحقيقية">
<label>المستوى</label><select id="level"><option>الأولى ثانوي — علوم</option><option>الأولى ثانوي — آداب</option><option>الثانية ثانوي</option><option>الثالثة ثانوي</option></select>
<label>الفصل</label><select id="chapter"><option>الفصل الأول</option><option>الفصل الثاني</option><option>الفصل الثالث</option></select>
<label>صور الدرس</label><div class="drop" onclick="document.getElementById('files').click()">📷 اختر صور الدرس<input id="files" type="file" accept="image/*" multiple hidden></div>
<div class="pre" id="pre"></div><button class="btn" onclick="upload()">نشر الدرس</button><div id="uploadMsg"></div></section>
<section class="card"><h2>📚 الدروس المنشورة</h2><div id="published">جاري التحميل...</div></section>
<section class="card"><h2>🔥 طلبات التلاميذ</h2><div id="requests">جاري التحميل...</div></section>
</div></main>
<script>
let files=[];const f=document.getElementById('files');f.onchange=e=>{files=[...files,...e.target.files];render()};
function render(){pre.innerHTML=files.map(x=>`<img src="${URL.createObjectURL(x)}">`).join('')}
async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pass.value})});if(r.ok){login.classList.add('hidden');document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');refresh()}else loginMsg.textContent='كلمة السر غير صحيحة'}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}
async function upload(){if(!title.value.trim()||!files.length){uploadMsg.textContent='أدخل العنوان واختر الصور.';return}const fd=new FormData();fd.append('title',title.value);fd.append('level',level.value);fd.append('chapter',chapter.value);files.forEach(x=>fd.append('images',x));const r=await fetch('/api/lessons',{method:'POST',body:fd});const d=await r.json();uploadMsg.textContent=r.ok?'تم نشر الدرس ✅':(d.error||'حدث خطأ');if(r.ok){title.value='';files=[];render();refresh()}}
async function refresh(){const r=await fetch('/api/lessons');const d=await r.json();published.innerHTML=d.length?d.map(x=>`<div class="item"><b>${x.title}</b> — ${x.images.length} صور <button class="btn danger" onclick="del('${x.id}')">حذف</button></div>`).join(''):'لا توجد دروس';const q=await fetch('/api/requests');const a=await q.json();requests.innerHTML=q.ok?(a.length?a.map(x=>`<div class="item"><b>${x.lesson}</b> — ${x.count} طلب</div>`).join(''):'لا توجد طلبات'):'تعذر تحميل الطلبات'}
async function del(id){if(!confirm('حذف هذا الدرس؟'))return;await fetch('/api/lessons/'+id,{method:'DELETE'});refresh()}
</script></body></html>
